<style>

  .kb-used { border-color: #e8b04b80; } .kb-shift-on { background: #e8b04b26; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  input[type=number] { -moz-appearance: textfield; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>

const PH = [{"th": "𒈗 𒆧𒆠", "lat": "lugal kiš{ki}", "cyr": "лугал киш", "say": "lugal kiš{ki}", "np": 1, "c": "royal", "ru": "царь Киша", "en": "king of Kish", "tip": ["Самый древний царский титул: тот, кто владел Кишем, считался владыкой всего Шумера. · ETCSRI", "The oldest royal title: whoever held Kish was seen as lord of all Sumer. · ETCSRI"], "hero": true}, {"th": "𒈗 𒆠𒂗𒄀 𒆠𒌵", "lat": "lugal ki-en-gi ki-uri", "cyr": "лугал киэнги киури", "say": "lugal ki-en-gi ki-uri", "np": 1, "c": "royal", "ru": "царь Шумера и Аккада", "en": "king of Sumer and Akkad", "tip": ["ki-en-gi — так шумеры называли свою страну. ki-uri — Аккад, север. · ETCSRI", "ki-en-gi is what the Sumerians called their land; ki-uri is Akkad, the north. · ETCSRI"], "hero": true}, {"th": "𒈗 𒀭𒌒𒁕 𒇹𒁀", "lat": "lugal an-ub-da limmu₂-ba", "cyr": "лугал анубда лиммуба", "say": "lugal an-ub-da limmu₂-ba", "np": 1, "c": "royal", "ru": "царь четырёх сторон света", "en": "king of the four quarters", "tip": ["Титул правителей, претендовавших на весь мир: an-ub-da — «стороны неба», limmu₂ — четыре. · ETCSRI", "Title of rulers claiming the whole world: an-ub-da “corners”, limmu₂ “four”. · ETCSRI"], "hero": true}, {"th": "𒌨𒀭𒇉 𒈗 𒋀𒀊𒆠𒈠", "lat": "ur-{d}namma lugal uri₅{ki}-ma", "cyr": "урнамма лугал урима", "say": "ur-{d}namma lugal uri₅{ki}-ma", "np": 1, "c": "royal", "ru": "Ур-Намму, царь Ура", "en": "Ur-Namma, king of Ur", "tip": ["-ma здесь — родительный падеж (-ak): «царь (чего?) Ура». · ETCSRI", "-ma here is the genitive (-ak): “king of Ur”. · ETCSRI"], "hero": true}, {"th": "𒂍𒀀𒉌 𒈬𒈾𒆕", "lat": "e₂-a-ni mu-na-du₃", "cyr": "эани мунаду", "say": "e₂-a-ni mu-na-du₃", "np": 1, "c": "royal", "ru": "он построил ему его храм", "en": "he built his temple for him", "tip": ["Концовка тысяч строительных надписей на кирпичах: e₂ — дом/храм, -a-ni — «его», mu-na-du₃ — «построил ему». · ETCSRI", "The ending of thousands of building inscriptions on bricks: e₂ house/temple, -a-ni “his”, mu-na-du₃ “built for him”. · ETCSRI"], "hero": true}, {"th": "𒅗⟨de₂⟩𒀀 𒉺𒋼𒋛 𒉢𒁓𒆷𒆠", "lat": "gu₃-de₂-a ensi₂ lagaš{ki}", "cyr": "гудэа энси лагаш", "say": "gu₃-de₂-a ensi₂ lagaš{ki}", "np": 1, "c": "royal", "ru": "Гудеа, правитель Лагаша", "en": "Gudea, ruler of Lagash", "tip": ["ensi₂ — правитель города, ниже «лугаля». · ETCSRI", "ensi₂ is a city ruler, below a lugal. · ETCSRI"], "hero": true}, {"th": "𒈗𒈬𒊏 𒅇𒈾𒀀𒅗", "lat": "lugal-ĝu₁₀-ra u₃-na-a-dug₄", "cyr": "лугалнгура унадуг", "say": "lugal-ĝu₁₀-ra u₃-na-a-dug₄", "np": 1, "c": "letter", "ru": "Моему господину скажи:", "en": "Say to my lord:", "tip": ["Письма начинались с обращения к гонцу, который читал письмо вслух адресату. · ETCSL 3.1.01", "Letters began by addressing the messenger, who read it aloud to the recipient. · ETCSL 3.1.01"], "hero": false}, {"th": "𒀵𒍪 𒈾𒀊𒁉𒀀", "lat": "arad₂-zu na-ab-be₂-a", "cyr": "арадзу наббэа", "say": "arad₂-zu na-ab-be₂-a", "np": 1, "c": "letter", "ru": "так говорит твой слуга", "en": "thus says your servant", "tip": ["Вторая часть формулы: кто пишет. Дальше — суть письма. · ETCSL 3.1.01", "Second half of the formula: who is writing. The message follows. · ETCSL 3.1.01"], "hero": false}, {"th": "𒁉 𒅘𒅘𒂊 𒀀 𒁀𒅘𒅘", "lat": "kaš naĝ-naĝ-e a ba-naĝ-naĝ", "cyr": "каш нангнангэ а банангнанг", "say": "kaš naĝ-naĝ-e a ba-naĝ-naĝ", "np": 1, "c": "proverb", "ru": "Кто пьёт пиво, пьёт воду.", "en": "He who drinks beer drinks water.", "tip": ["Повтор основы naĝ-naĝ — признак повторяющегося действия. · ETCSL 6.1.01", "Repeating the root naĝ-naĝ marks a repeated action. · ETCSL 6.1.01"], "hero": true}, {"th": "𒁉 𒄞𒁮 𒅗 𒄿𒇻𒁉𒅎", "lat": "kaš gud-dam ka kun₄-bi-im", "cyr": "каш гуддам ка кунбим", "say": "kaš gud-dam ka kun₄-bi-im", "np": 1, "c": "proverb", "ru": "Пиво — это бык, а рот — его лестница.", "en": "Beer is a bull. The mouth is its stairway.", "tip": ["-am₃ / -im — «есть, является»: связка в конце фразы. · ETCSL 6.1.01", "-am₃ / -im means “is” — the copula comes last. · ETCSL 6.1.01"], "hero": true}, {"th": "𒃻 𒄑𒈣𒀀𒀭 𒀀 𒄑𒄀𒈲𒀀𒀭", "lat": "ninda {ĝiš}ma₂-am₃ a {ĝiš}gi-muš-am₃", "cyr": "нинда мам а гимушам", "say": "ninda {ĝiš}ma₂-am₃ a {ĝiš}gi-muš-am₃", "np": 1, "c": "proverb", "ru": "Хлеб — лодка, вода — шест.", "en": "Bread is the boat, water is the punt-pole.", "tip": ["{ĝiš} — определитель «дерево»: не читается, подсказывает, что ma₂ (лодка) деревянная. · ETCSL 6.1.01", "{ĝiš} is the “wood” determinative: silent, it hints that ma₂ (boat) is wooden. · ETCSL 6.1.01"], "hero": true}, {"th": "𒉆𒋻 𒌓 𒍽 𒌦𒈠 𒊑𒀀", "lat": "nam-tar ud ḫuš kalam-ma ri-a", "cyr": "намтар уд хуш каламма риа", "say": "nam-tar ud ḫuš kalam-ma ri-a", "np": 1, "c": "proverb", "ru": "Судьба — свирепая буря, что носится по стране.", "en": "Fate is a raging storm blowing over the Land.", "tip": ["nam-tar — «судьба», буквально «то, что отрезано (решено)». · ETCSL 6.1.02", "nam-tar “fate”, literally “what is cut (decided)”. · ETCSL 6.1.02"], "hero": true}, {"th": "𒅗 𒅅 𒋺𒀀 𒉏 𒁀𒀭𒆭𒆭", "lat": "ka ĝal₂ taka₄-a nim ba-an-ku₄-ku₄", "cyr": "ка нгал така ним банкуку", "say": "ka ĝal₂ taka₄-a nim ba-an-ku₄-ku₄", "np": 1, "c": "proverb", "ru": "В открытый рот залетают мухи.", "en": "Flies enter an open mouth.", "tip": ["Шумерский вариант нашего «молчание — золото». · ETCSL 6.1.03", "The Sumerian take on “silence is golden”. · ETCSL 6.1.03"], "hero": true}, {"th": "𒅗 𒄭 𒆪𒇷 𒇽 𒊹𒊏𒅗", "lat": "inim dug₃ gu₅-li lu₂ šar₂-ra-ka", "cyr": "иним дуг гули лу шаррака", "say": "inim dug₃ gu₅-li lu₂ šar₂-ra-ka", "np": 1, "c": "proverb", "ru": "Доброе слово — друг многим людям.", "en": "A good word is a friend to numerous men.", "tip": ["inim — «слово», dug₃ — «сладкий, добрый». · ETCSL 6.1.03", "inim “word”, dug₃ “sweet, good”. · ETCSL 6.1.03"], "hero": true}, {"th": "𒌓 𒈠𒊏𒀭𒅅 𒍥 𒅡𒀀", "lat": "ud ma-ra-an-ĝal₂ zid₂ ma₅-a", "cyr": "уд мараннгал зид ма", "say": "ud ma-ra-an-ĝal₂ zid₂ ma₅-a", "np": 1, "c": "proverb", "ru": "Пока есть свет — мели муку.", "en": "While you still have light, grind the flour.", "tip": ["Шумерское «куй железо, пока горячо». · ETCSL 6.1.03", "The Sumerian “make hay while the sun shines”. · ETCSL 6.1.03"], "hero": true}, {"th": "𒂍𒂠 𒂵𒁺𒈾 𒊕 𒀀𒀊𒆗", "lat": "e₂-še₃ ga-ĝen-na saĝ a-ab-kal", "cyr": "эшэ гангэнна санг абкал", "say": "e₂-še₃ ga-ĝen-na saĝ a-ab-kal", "np": 1, "c": "proverb", "ru": "«Пойду-ка я домой» — вот что ему дороже всего.", "en": "“I’m going home” is what he prefers.", "tip": ["ga- — «давай я…»: ga-ĝen «пойду-ка». · ETCSL 6.1.03", "ga- means “let me…”: ga-ĝen “let me go”. · ETCSL 6.1.03"], "hero": true}, {"th": "𒃻 𒈤 𒅥𒅥𒂊 𒅇 𒉡𒌝𒅆𒆪𒆪", "lat": "niĝ₂ maḫ gu₇-gu₇-e u₃ nu-um-ši-ku-ku", "cyr": "нинг мах гугуэ у нумшикуку", "say": "niĝ₂ maḫ gu₇-gu₇-e u₃ nu-um-ši-ku-ku", "np": 1, "c": "proverb", "ru": "Кто ест слишком много, не может уснуть.", "en": "He who eats too much cannot sleep.", "tip": ["nu- — отрицание в начале глагола. · ETCSL 6.1.01", "nu- is the negation at the start of the verb. · ETCSL 6.1.01"], "hero": true}, {"th": "𒀭 𒃲𒋫 𒆠 𒃲𒂠 𒄑𒌆𒉿𒂵𒉌 𒈾𒀭𒁺", "lat": "an gal-ta ki gal-še₃ ĝeštug₂-ga-ni na-an-gub", "cyr": "ан галта ки галшэ нгэштуггани нангуб", "say": "an gal-ta ki gal-še₃ ĝeštug₂-ga-ni na-an-gub", "np": 1, "c": "lit", "ru": "С великих небес к великой земле она обратила свой разум.", "en": "From the great heaven she set her mind on the great below.", "tip": ["Первая строка «Нисхождения Инанны в подземный мир». -ta — «из», -še₃ — «к». · ETCSL 1.4.1", "First line of “Inana’s Descent to the Netherworld”. -ta “from”, -še₃ “to”. · ETCSL 1.4.1"], "hero": true}, {"th": "𒀭𒈹 𒀭 𒈬𒌦𒊒 𒆠 𒈬𒌦𒊒 𒆳𒊏 𒁀𒂊𒀀𒇯𒁺", "lat": "{d}inana an mu-un-šub ki mu-un-šub kur-ra ba-e-a-ed₃", "cyr": "инана ан муншуб ки муншуб курра баэаэд", "say": "{d}inana an mu-un-šub ki mu-un-šub kur-ra ba-e-a-ed₃", "np": 1, "c": "lit", "ru": "Инанна оставила небо, оставила землю и сошла в подземный мир.", "en": "Inana abandoned heaven, abandoned earth, and descended to the underworld.", "tip": ["kur — и «гора», и «чужая страна», и «подземный мир». · ETCSL 1.4.1", "kur means mountain, foreign land and the netherworld. · ETCSL 1.4.1"], "hero": true}, {"th": "𒇽𒆥𒄄𒀀 𒀝𒂵 𒌉 𒂗𒈨𒁈𒄄 .02"], "hero": true}, {"th": "𒉈 𒉡𒌒𒁕𒀭𒋼𒀀𒀸 𒇷𒄄𒅔𒍪 𒊬𒊏𒀊", "lat": "izi nu-ub-da-an-ten-a-aš li-gi₄-in-zu sar-ra-ab", "cyr": "изи нубдантэнаш лигинзу сарраб", "say": "izi nu-ub-da-an-ten-a-aš li-gi₄-in-zu sar-ra-ab", "np": 1, "c": "scribe", "ru": "Пока огонь не погас, пиши свою табличку!", "en": "Before the fire has gone out, write your exercise tablet!", "tip": ["sar — «писать». -ab в конце — повелительное наклонение. · ETCSL 6.1.03", "sar “to write”. -ab at the end marks the imperative. · ETCSL 6.1.03"], "hero": true}, {"th": "𒁾𒊬 𒋗 𒉡𒀀 𒈜 𒅲 𒉡𒀀", "lat": "dub-sar šu nu-a nar ĝili₃ nu-a", "cyr": "дубсар шу нуа нар нгили нуа", "say": "dub-sar šu nu-a nar ĝili₃ nu-a", "np": 1, "c": "scribe", "ru": "Писец без руки — что певец без голоса.", "en": "A scribe without a hand. A singer without a throat.", "tip": ["šu — «рука», nu-a — «нет». · ETCSL 6.1.02", "šu “hand”, nu-a “without”. · ETCSL 6.1.02"], "hero": true}, {"th": "𒀭𒈹𒆤 𒊮 𒍼𒂵𒈬 𒉌 𒃶𒅁⟨de₂⟩", "lat": "{d}inana-ke₄ šag₄ gig-ga-ĝu₁₀ i₃ ḫe₂-eb-de₂", "cyr": "инанакэ шаг гиггангу и хэбдэ", "say": "{d}inana-ke₄ šag₄ gig-ga-ĝu₁₀ i₃ ḫe₂-eb-de₂", "np": 1, "c": "gods", "ru": "Пусть Инанна прольёт масло на моё больное сердце.", "en": "May Inana pour oil on my heart that aches.", "tip": ["ḫe₂- — «пусть»: пожелание и молитва. · ETCSL 6.1.03", "ḫe₂- means “may”: wishes and prayers. · ETCSL 6.1.03"], "hero": false}, {"th": "𒀭 𒀬𒊏 𒈨𒋼𒁉𒅎", "lat": "diĝir sizkur-ra me-te-bi-im", "cyr": "дингир сизкурра мэтэбим", "say": "diĝir sizkur-ra me-te-bi-im", "np": 1, "c": "gods", "ru": "Жертвы — слава богов.", "en": "Offerings are the glory of the gods.", "tip": ["diĝir — «бог», знак-звезда 𒀭. · ETCSL 6.1.02", "diĝir “god”, the star sign 𒀭. · ETCSL 6.1.02"], "hero": false}, {"th": "𒀬𒀬𒊑 𒉆𒋾 𒉌𒅇𒌅", "lat": "sizkur₂-re nam-til₃ i₃-u₃-tud", "cyr": "сизкуррэ намтил иутуд", "say": "sizkur₂-re nam-til₃ i₃-u₃-tud", "np": 1, "c": "gods", "ru": "Жертвы порождают жизнь.", "en": "Offerings create life.", "tip": ["nam-til₃ — «жизнь»: nam- превращает слово в отвлечённое понятие. function renderDlg() {
  const sc = SCENES[dlg.s], n = sc.steps.length;
  $('#sceneTabs').innerHTML = SCENES.map((x, i) => `<button data-scene="${i}" class="${chip(i === dlg.s)}"><i data-lucide="${x.icon}" class="w-3.5 h-3.5"></i>${x[lang]}</button>`).join('');
  $('#dlgProg').textContent = `${t('dlgStep')} ${Math.min(dlg.step + 1, n)} / ${n}`;
  $('#dlgLog').innerHTML = dlg.log.map(dlgBubble).join('');
  if (dlg.done) {
    $('#dlgOpts').innerHTML = `<div class="fade-up pop rounded-2xl border border-emerald-400/30 bg-emerald-400/5 p-6 text-center">
      <i data-lucide="party-popper" class="w-8 h-8 mx-auto text-emerald-400"></i><p class="mt-3 font-bold text-white">${t('dlgDone')}</p>
      <button data-scene="${(dlg.s + 1) % SCENES.length}" class="mt-4 inline-flex items-center gap-2 rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-ink-950 hover:brightness-110 transition">${t('dlgNext')}<i data-lucide="arrow-right" class="w-4 h-4"></i></button></div>`;
    return;
  }
  if (dlg.wait) { $('#dlgOpts').innerHTML = `<div class="flex justify-start gap-1.5 pl-10 py-3">${[0, 1, 2].map(i => `<span class="w-2 h-2 rounded-full bg-zinc-600 animate-pulse" style="animation-delay:${i * 150}ms"></span>`).join('')}</div>`; return }
  const opts = sc.steps[dlg.step].you, nextStep = sc.steps[dlg.step + 1];
  opts.forEach(o => preload(dlgYouSay(o), dlgYouV()));
  if (nextStep) preload(nextStep.them.th, nextStep.them.v);
  $('#dlgOpts').innerHTML = `<p class="text-xs uppercase tracking-widest text-zinc-500">${t('dlgYou')}</p>` + dlg.order.map(i => { const o = opts[i]; return `
    <button data-opt="${i}" class="fade-up text-left rounded-xl border border-white/10 bg-ink-900 px-4 py-3 hover:border-accent/50 transition">
      <span class="font-thai text-lg text-white">${o.th}<span class="text-accent/70">${pt(o.th).th}</span></span>
      <span class="block font-mono text-xs text-accent">${o.lat} ${pt(o.th).lat}</span>
      <span class="block text-base text-white">${o[lang]}</span></button>` }).join('');
}
function dlgTheirTurn(token) {
  if (token !== dlg.token || !dlg.wait) return;
  const st = SCENES[dlg.s].steps[dlg.step];
  dlg.wait = false;
  dlg.log.push({ who: 'them', ...st.them });
  dlg.order = shuffle(st.you.map((_, k) => k));
  renderDlg(); icons();
  speak(st.them.th, null, st.them.v);
}
$('#dlgOpts').addEventListener('click', e => {
  const b = e.target.closest('[data-opt]');
  if (!b) return;
  const o = SCENES[dlg.s].steps[dlg.step].you[+b.dataset.opt];
  if (!o.ok) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake', '!border-rose-400'); $('#dlgWhy').textContent = L(...o.why); return }
  $('#dlgWhy').textContent = '';
  dlg.log.push({ who: 'you', ...o });
  dlg.step++;
  const token = ++dlg.token;
  if (dlg.step >= SCENES[dlg.s].steps.length) { dlg.done = true; speak(dlgYouSay(o), null, dlgYouV()); renderDlg(); icons(); return }
  dlg.wait = true;
  renderDlg(); icons();
  // their reply comes after your line finishes (or after 5s if audio is interrupted)
  speak(dlgYouSay(o), null, dlgYouV(), () => setTimeout(() => dlgTheirTurn(token), 350));
  setTimeout(() => dlgTheirTurn(token), 5000);
});

  $('#qPrompt').innerHTML = `<div class="fade-up">

  $('#qOpts').innerHTML = q.opts.map(i => `<button data-q="${i}" class="fade-up rounded-xl border border-white/10 bg-ink-900 px-5 py-4 text-left font-medium hover:border-white/30 transition">${items()[i][lang]}</button>`).join('');

/* trace */
// Scoring compares pixels: glyph vs. user ink, each with a tolerance halo.
// ponytail: no stroke-order check — needs per-letter stroke data we don't have.
const TR_SETS = {
  syl: () => TR_SYL,
  log: () => TR_LOG,
  num: () => TR_NUM
};
const TR_W = 340;
// glyph size (share of the canvas), brush width and scoring tolerance per size; small one is meant for a stylus
const TR_SIZES = { l: { k: .62, brush: 15, tol: 9 }, m: { k: .32, brush: 10, tol: 7 }, s: { k: .17, brush: 5, tol: 4 }, xs: { k: .085, brush: 2.5, tol: 2.5 } };
const TR_EV = 2; // masks are evaluated at 2× so thin strokes of the small sizes stay accurate
const tr = { set: 'syl', size: 'm', i: 0, strokes: [], drawing: false, checked: false };
const trSz = () => TR_SIZES[tr.size];
// template styles: printed with loops + three handwriting fonts
const TR_STYLES = { cun: ['Noto Sans Cuneiform', 400] };
tr.style = 'cun'; tr.slant = 0;
const trFontCss = fs => { const [fam, w] = TR_STYLES[tr.style]; return `${w} ${fs}px '${fam}'` };
const trCv = $('#trCanvas'), trCtx = trCv.getContext('2d');
const trDpr = Math.min(window.devicePixelRatio || 1, 3);
trCv.width = trCv.height = TR_W * trDpr;
const trList = () => TR_SETS[tr.set]();
const trCur = () => trList()[tr.i];

// Copybook mode (only for the "writing" size): the letter is repeated in a grid of cells
const TR_PROP = { cols: 4, rows: 4 };
tr.prop = true;
const trPropOn = () => tr.size === 'xs' && tr.prop;
const trCells = () => {
  if (!trPropOn()) return [[TR_W / 2, TR_W / 2]];
  const { cols, rows } = TR_PROP, out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out.push([TR_W * (c + .5) / cols, TR_W * (r + .5) / rows]);
  return out;
};
const trCellOf = (x, y) => {
  const { cols, rows } = TR_PROP;
  return Math.min(rows - 1, y * rows / TR_W | 0) * cols + Math.min(cols - 1, x * cols / TR_W | 0);
};

function trFont(ctx, text, cx, cy) {
  let fs = TR_W * trSz().k;
  ctx.font = trFontCss(fs);
  let m = ctx.measureText(text);
  const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  fs *= Math.min(TR_W * trSz().k * 1.08 / Math.max(w, h, 1), 1.5);
  ctx.font = trFontCss(fs);
  m = ctx.measureText(text);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  return {
    x: cx - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2,
    y: cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2
  };
}
// draws the glyph in every cell, or only in cell `only`
function trGlyph(ctx, color, halo = 0, only = -1) {
  const g = trCur().g;
  trCells().forEach(([cx, cy], k) => {
    if (only >= 0 && k !== only) return;
    const { x, y } = trFont(ctx, g, cx, cy);
    ctx.save();
    // slant around the cell centre (positive = leaning right, like handwriting)
    ctx.translate(cx, cy); ctx.transform(1, 0, -Math.tan(tr.slant * Math.PI / 180), 1, 0, 0); ctx.translate(-cx, -cy);
    ctx.fillStyle = ctx.strokeStyle = color;
    ctx.fillText(g, x, y);
    if (halo) { ctx.lineWidth = halo * 2; ctx.lineJoin = 'round'; ctx.strokeText(g, x, y) }
    ctx.restore();
  });
}
function trInk(ctx, color, width) {
  const b = trSz().brush, grow = Math.max(0, width - b);       // grow > 0: dilated copy used for scoring tolerance
  const W = b * 2.4, H = b * 2.2, TW = Math.max(1.2, b * .4);  // head width, head length, tail width
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineCap = ctx.lineJoin = 'round';
  for (const st of tr.strokes) {
    const [sx, sy] = st[0], [ex, ey] = st[st.length - 1];
    let dx = ex - sx, dy = ey - sy, len = Math.hypot(dx, dy);
    if (len < H * .6) { dx = -1; dy = 0; len = 0 } else { dx /= len; dy /= len }  // a tap = Winkelhaken pointing left (𒌋)
    const px = -dy, py = dx;
    ctx.beginPath();
    ctx.moveTo(sx + px * W / 2, sy + py * W / 2); ctx.lineTo(sx - px * W / 2, sy - py * W / 2); ctx.lineTo(sx + dx * H, sy + dy * H); ctx.closePath();
    ctx.fill();
    if (grow) { ctx.lineWidth = grow; ctx.stroke() }
    if (len > H) {
      ctx.lineWidth = TW + grow;
      ctx.beginPath(); ctx.moveTo(sx + dx * H * .7, sy + dy * H * .7); ctx.lineTo(ex, ey); ctx.stroke();
    }
  }
}
function trGuides() {
  const c = trCtx;
  if (!trPropOn()) {
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1; c.setLineDash([4, 6]);
    c.beginPath(); c.moveTo(TR_W / 2, 0); c.lineTo(TR_W / 2, TR_W); c.moveTo(0, TR_W / 2); c.lineTo(TR_W, TR_W / 2); c.stroke();
    c.setLineDash([]);
    return;
  }
  // copybook ruling: top / bottom line per row, dashed midline, faint cell dividers
  const { cols, rows } = TR_PROP, half = TR_W * trSz().k * .75;
  for (let r = 0; r < rows; r++) {
    const cy = TR_W * (r + .5) / rows;
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(8, cy - half); c.lineTo(TR_W - 8, cy - half); c.moveTo(8, cy + half); c.lineTo(TR_W - 8, cy + half); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.06)'; c.setLineDash([3, 5]);
    c.beginPath(); c.moveTo(8, cy); c.lineTo(TR_W - 8, cy); c.stroke(); c.setLineDash([]);
  }
  c.strokeStyle = 'rgba(255,255,255,.04)';
  c.beginPath();
  for (let k = 1; k < cols; k++) { c.moveTo(TR_W * k / cols, 0); c.lineTo(TR_W * k / cols, TR_W) }
  for (let k = 1; k < rows; k++) { c.moveTo(0, TR_W * k / rows); c.lineTo(TR_W, TR_W * k / rows) }
  c.stroke();
}
function trRedraw() {
  trCtx.setTransform(trDpr, 0, 0, trDpr, 0, 0);
  trCtx.clearRect(0, 0, TR_W, TR_W);
  trGuides();
  if (!$('#trHide').checked) {
    if (trPropOn()) { trGlyph(trCtx, 'rgba(255,255,255,.07)'); trGlyph(trCtx, 'rgba(255,255,255,.3)', 0, 0) }
    else trGlyph(trCtx, 'rgba(255,255,255,.13)');
  }
  trInk(trCtx, '#e8b04b', trSz().brush);
}
function trMask(draw) {
  const N = TR_W * TR_EV, c = document.createElement('canvas'); c.width = c.height = N;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.scale(TR_EV, TR_EV);
  draw(ctx);
  const d = ctx.getImageData(0, 0, N, N).data, out = new Uint8Array(N * N);
  for (let i = 0; i < out.length; i++) out[i] = d[i * 4 + 3] > 100;
  return out;
}
const f1 = (cover, prec) => Math.round(200 * cover * prec / (cover + prec || 1));
function trCheck() {
  if (!tr.strokes.length) return toast(t('trEmpty'));
  const G = trMask(c => trGlyph(c, '#fff')), Gd = trMask(c => trGlyph(c, '#fff', trSz().tol));
  const U = trMask(c => trInk(c, '#fff', trSz().brush)), Ud = trMask(c => trInk(c, '#fff', trSz().brush + trSz().tol * 2));
  const N = TR_W * TR_EV, nc = trCells().length;
  const cell = [...Array(nc)].map(() => ({ g: 0, gHit: 0, u: 0, uHit: 0 }));
  const img = new ImageData(N, N), px = img.data;
  const paint = (i, r, gg, b, a) => { px[i * 4] = r; px[i * 4 + 1] = gg; px[i * 4 + 2] = b; px[i * 4 + 3] = a };
  for (let i = 0; i < G.length; i++) {
    if (!G[i] && !U[i]) continue;
    const s = cell[nc > 1 ? trCellOf((i % N) / TR_EV, (i / N | 0) / TR_EV) : 0];
    if (G[i]) { s.g++; if (Ud[i]) { s.gHit++; paint(i, 52, 211, 153, 255) } else paint(i, 251, 113, 133, 255) }
    if (U[i]) { s.u++; if (Gd[i]) s.uHit++; else if (!G[i]) paint(i, 251, 146, 60, 150) }
  }
  // copybook: every cell must contain writing before it is graded
  const filled = cell.filter(s => s.u > s.g * .15).length;
  if (nc > 1 && filled < nc) return toast(t('trPropLeft').replace('{n}', filled).replace('{total}', nc));
  const scores = cell.map(s => f1(s.gHit / s.g, s.u ? s.uHit / s.u : 0));
  const sum = cell.reduce((a, s) => ({ g: a.g + s.g, gHit: a.gHit + s.gHit, u: a.u + s.u, uHit: a.uHit + s.uHit }), { g: 0, gHit: 0, u: 0, uHit: 0 });
  const cover = sum.gHit / sum.g, prec = sum.uHit / sum.u;
  const score = nc > 1 ? Math.round(scores.reduce((a, b) => a + b, 0) / nc) : scores[0];
  const off = document.createElement('canvas'); off.width = off.height = N;
  off.getContext('2d').putImageData(img, 0, 0);
  trCtx.setTransform(trDpr, 0, 0, trDpr, 0, 0);
  trCtx.clearRect(0, 0, TR_W, TR_W); trGuides();
  trCtx.drawImage(off, 0, 0, TR_W, TR_W);
  tr.checked = true;
  let stars = score >= 88 ? 3 : score >= 75 ? 2 : score >= 55 ? 1 : 0;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const spk = { i: 0, url: null, rec: null, recording: false, listening: false };
const normTh = s => s.toLowerCase().replace(/[^a-z]/g, '');
function simil(a, b) {
  a = normTh(a); b = normTh(b);
  if (!a || !b) return 0;
  let prev = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[b.length] / Math.max(a.length, b.length);
}

  if (spk.recording) return spk.rec.stop();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      spRender(); icons();

    };

/* ================= KEYBOARD ================= */
// No cuneiform layout exists. ATF: transliteration in Latin letters, as in ORACC and ETCSL.
// EME: a cuneiform layout made up for this project (built by gen.py from OGSL, see KB_EME).
const KB_EX = ['lugal', 'ĝiš', 'šu', 'dub-sar', 'e₂', 'diĝir'];
const KB_ACC = { 'á': 'a2', 'é': 'e2', 'í': 'i2', 'ú': 'u2', 'à': 'a3', 'è': 'e3', 'ì': 'i3', 'ù': 'u3' };
const atfConv = s => s.replace(/sz/g, 'š').replace(/S[zZ]/g, 'Š').replace(/s,/g, 'ṣ').replace(/S,/g, 'Ṣ').replace(/t,/g, 'ṭ').replace(/T,/g, 'Ṭ')
  .replace(/j/g, 'ĝ').replace(/J/g, 'Ĝ').replace(/h/g, 'ḫ').replace(/H/g, 'Ḫ')
  .replace(/([a-zA-ZšĝḫṣṭŠĜḪṢṬ₀-₉])([0-9])/g, (m, a, d) => a + '₀₁₂₃₄₅₆₇₈₉'[d]).replace(/([₀-₉])([0-9])/g, (m, a, d) => a + '₀₁₂₃₄₅₆₇₈₉'[d]);
const atfKeys = s => s.replace(/[áéíúàèìù]/g, c => KB_ACC[c]).replace(/š/g, 'sz').replace(/Š/g, 'SZ').replace(/ṣ/g, 's,').replace(/Ṣ/g, 'S,').replace(/ṭ/g, 't,').replace(/Ṭ/g, 'T,')
  .replace(/[ĝŋ]/g, 'j').replace(/[ĜŊ]/g, 'J').replace(/ḫ/g, 'h').replace(/Ḫ/g, 'H').replace(/[₀-₉]/g, c => '₀₁₂₃₄₅₆₇₈₉'.indexOf(c));
// typed signs -> transliteration: signs of a word joined by hyphens
const emeTr = v => v.split(/\s+/).filter(Boolean).map(w => [...w].map(c => KB_EME.read[c] || '?').join('-')).join(' ');
// numbers are sexagesimal: each space-separated group of numeral signs is one place (0–59)
const emeNum = v => {
  const g = v.split(/\s+/).filter(Boolean).map(w => [...w].reduce((s, c) => s + (KB_EME.num[c] ?? NaN), 0));
  if (!g.length || g.some(x => !(x <= 59))) return '';
  const n = g.reduce((a, x) => a * 60 + x, 0);
  return g.length < 2 ? `= ${n}` : g.map((x, i) => x + (g.length - 1 - i ? ` × ${60 ** (g.length - 1 - i)}` : '')).join(' + ') + ` = ${n}`;
};
const kbCun = c => c ? `<p class="mt-5 font-thai text-5xl text-white">${esc(c)}</p>` : '';
const KB_SETS = [{
  name: ['ATF · латиница', 'ATF · Latin'], ph: 'kbPh', note: 'kbNote', ex: KB_EX,
  rows: [
    ['`1234567890-=\\', '`1234567890-=\\', '~!@#$%^&*()_+|'],
    ['qwertyuiop[]', 'qwertyuiop[]', 'QWERTYUIOP{}'],
    ["asdfghjkl;'", "asdfghjkl;'", 'ASDFGHJKL:"'],
    ['zxcvbnm,./', 'zxcvbnm,./', 'ZXCVBNM<>?'],
  ],
  hint: { s: 'š', j: 'ĝ', h: 'ḫ', ',': 'ṣ ṭ', 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉' },
  conv: atfConv, keys: ch => [...atfKeys(ch)], read: null,
  say: v => AUDIO[gender][v] ? v : '',
  out: v => kbCun(KB_CUN[v]),
}, {
  name: ['EME · клинопись', 'EME · cuneiform'], ph: 'kbPhEme', note: 'kbNoteEme', ex: KB_EME.ex,
  rows: KB_EME.rows, hint: {},
  conv: s => s, keys: ch => [ch], read: ch => KB_EME.read[ch] || '',
  say: v => AUDIO[gender][emeTr(v)] ? emeTr(v) : '',
  out: v => { const n = emeNum(v); return !v ? '' : n ? `<p class="mt-4 font-mono text-lg text-accent">${esc(n)}</p>` : `<p class="mt-4 font-mono text-lg text-accent">${esc(emeTr(v))}</p>` },
}];
const KB_CODE = { '`': 'Backquote', '-': 'Minus', '=': 'Equal', '[': 'BracketLeft', ']': 'BracketRight', '\\': 'Backslash', ';': 'Semicolon', "'": 'Quote', ',': 'Comma', '.': 'Period', '/': 'Slash' };
const KB_MOD = ['', '⇧ ', 'AltGr ', 'AltGr ⇧ '];
const esc = v => String(v).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const kbShow = ch => /\p{M}/u.test(ch) ? '◌' + ch : ch;
let kbSet = 0, KB = [], KB_FIND = new Map(), kbLayers = 2, kbMod = 0, kbHeld = 0, kbDrawn = 0, kbTimer;
const kbS = () => KB_SETS[kbSet];
function kbBuild() {
  const S = kbS();
  KB = S.rows.flatMap(([lat, ...layers], r) => {
    const L = layers.map(l => typeof l === 'string' ? [...l] : l);
    return [...lat].map((l, i) => ({ r, l, code: KB_CODE[l] || (/\d/.test(l) ? 'Digit' + l : 'Key' + l.toUpperCase()), out: L.map(x => x[i] || '') }));
  });
  kbLayers = Math.max(...S.rows.map(r => r.length - 1));
  KB_FIND = new Map();   // output -> [key, layer]; the plainest layer wins
  for (let m = kbLayers - 1; m >= 0; m--) KB.forEach(k => k.out[m] && KB_FIND.set(k.out[m], [k, m]));
}
// one entry per shown character, with the keys that type it: [{ code, l, m }] (null = no key)
const kbSeq = v => [...v].map(ch => ({ ch, keys: ch === ' ' ? [{ code: 'Space', l: 'Space', m: 0 }] : kbS().keys(ch).map(c => KB_FIND.has(c) ? { code: KB_FIND.get(c)[0].code, l: KB_FIND.get(c)[0].l, m: KB_FIND.get(c)[1] } : null) }));
// every key is one unit wide and rows are centred: the rows step in like a trapezoid
const kbW = n => `flex:0 0 calc((100% - ${(kbCols() - 1) * .375}rem) * ${n} / ${kbCols()} + ${(n - 1) * .375}rem)`;
const kbCols = () => Math.max(...kbS().rows.map(r => [...r[0]].length));
const kbBtn = (code, inner, n = 1) => `<button type="button" data-kb="${code}" class="kb-key" style="${kbW(n)}">${inner}</button>`;
const kbCap = (s, cls) => s ? `<span class="${cls}">${esc(kbShow(s))}</span>` : '';
// key face for the active modifier layer m: that layer goes to the centre, the plain one takes its corner
const KB_POS = ['font-thai text-xl', 'absolute right-1.5 top-1 text-xs font-thai', 'absolute right-1.5 bottom-1 text-xs font-thai', 'absolute left-1.5 bottom-1 text-xs font-thai'];
function kbFace(k, m) {
  const S = kbS(), at = l => l === m ? 0 : l === 0 ? m : l;
  return `<span class="absolute left-1.5 top-1 font-mono text-[10px] uppercase text-zinc-500">${esc(k.l)}</span>` + k.out.map((o, l) => {
    const p = at(l);
    if (p === 1 && S.hint[k.l]) return `<span class="${KB_POS[1]} font-semibold text-accent">${esc(S.hint[k.l])}</span>`;
    return kbCap(o, `${KB_POS[p]} ${p ? 'text-zinc-500' : m ? 'text-accent' : 'text-white'}`);
  }).join('');
}
// redraw key faces when the visible layer changes (on-screen Shift/AltGr or held physical modifiers)
function kbFaces() {
  const m = (kbMod | kbHeld) & (kbLayers > 2 ? 3 : 1);
  if (m === kbDrawn) return;
  kbDrawn = m;
  KB.forEach(k => { const b = $(`[data-kb="${k.code}"]`); if (b) b.innerHTML = kbFace(k, m) });
}
function kbRender() {
  kbBuild();
  const S = kbS(), on = 'bg-white text-ink-950', off = 'text-zinc-400 hover:text-white';
  $('#kbTabs').innerHTML = KB_SETS.length < 2 ? '' : `<div class="inline-flex rounded-lg border border-white/10 p-0.5 text-sm font-semibold">${KB_SETS.map((x, i) => `<button type="button" data-kbset="${i}" class="px-3 py-1.5 rounded-md transition ${i === kbSet ? on : off}">${esc(L(...x.name))}</button>`).join('')}</div>`;
  $('#kbIn').placeholder = t(S.ph);
  $('#kbRows').classList.toggle('kb-tall', kbLayers > 2);
  $('#kbNote').innerHTML = t(S.note);
  kbDrawn = 0;
  $('#kbRows').innerHTML = S.rows.map((_, r) => `<div class="flex justify-center gap-1.5">${KB.filter(k => k.r === r).map(k => kbBtn(k.code, kbFace(k, 0))).join('')}</div>`).join('') + `
    <div class="flex justify-center gap-1.5">${kbBtn('Shift', '<span class="text-xs text-zinc-300">⇧ Shift</span>', 2)}${kbLayers > 2 ? kbBtn('AltGr', '<span class="text-xs text-zinc-300">AltGr</span>', 2) : ''}${kbBtn('Space', '<span class="text-xs text-zinc-500">Space</span>', kbLayers > 2 ? 5 : 7)}${kbBtn('Backspace', '<span class="text-xs text-zinc-300">⌫</span>', 2)}</div>`;
  $('#kbEx').innerHTML = S.ex.map(w => `<button type="button" data-kbex="${esc(w)}" class="rounded-lg border border-white/10 px-3 py-1.5 font-thai text-white hover:border-accent/60 transition">${esc(w)}</button>`).join('');
  kbUpdate();
}
function kbUpdate() {
  const S = kbS(), v = $('#kbIn').value, seq = kbSeq(v), keys = seq.flatMap(x => x.keys).filter(Boolean);
  $$('.kb-key').forEach(b => b.classList.toggle('kb-used', keys.some(k => k.code === b.dataset.kb || (b.dataset.kb === 'Shift' && k.m & 1) || (b.dataset.kb === 'AltGr' && k.m & 2))));
  $('[data-kb="Shift"]').classList.toggle('kb-shift-on', !!(kbMod & 1));
  $('[data-kb="AltGr"]')?.classList.toggle('kb-shift-on', !!(kbMod & 2));
  kbFaces();
  $('#kbSeq').innerHTML = seq.length ? seq.map((x, i) => `<span data-kbi="${i}" class="inline-flex flex-col items-center min-w-[44px] rounded-lg border border-white/10 bg-ink-950 px-2 py-1">
    <span class="font-thai text-lg leading-tight text-white">${x.ch === ' ' ? '␣' : esc(kbShow(x.ch))}</span>
    ${S.read?.(x.ch) ? `<span class="font-mono text-[11px] text-accent">${esc(S.read(x.ch))}</span>` : ''}
    <span class="font-mono text-[11px] text-zinc-500">${x.keys.map(k => k ? KB_MOD[k.m] + esc(k.l.length > 1 ? k.l : k.l.toUpperCase()) : '?').join(' ')}</span></span>`).join('') : `<span class="self-center text-sm text-zinc-500">${t('kbEmpty')}</span>`;
  const say = v.trim() && S.say(v.trim());
  $('#kbSay').dataset.say = say || ''; $('#kbSay').classList.toggle('invisible', !say);
  $('#kbOut').innerHTML = S.out(v.trim());
}
function kbType(ch) {
  if (!ch) return;
  const el = $('#kbIn');
  el.setRangeText(ch, el.selectionStart ?? el.value.length, el.selectionEnd ?? el.value.length, 'end');
  const v = kbS().conv(el.value); if (v !== el.value) el.value = v;
  kbUpdate();
}
function kbFlash(code) {
  const b = $(`[data-kb="${code}"]`); if (!b) return;
  b.classList.add('kb-on'); setTimeout(() => b.classList.remove('kb-on'), 160);
}
function kbPlay() {
  clearTimeout(kbTimer);
  const steps = kbSeq($('#kbIn').value).flatMap((x, i) => x.keys.map(k => ({ i, k })));
  const off = () => $$('.kb-on').forEach(b => b.classList.remove('kb-on'));
  const step = i => {
    off();
    if (i >= steps.length) return;
    const { i: ci, k } = steps[i];
    $(`[data-kbi="${ci}"]`)?.classList.add('kb-on');
    if (k) $(`[data-kb="${k.code}"]`)?.classList.add('kb-on');
    if (k?.m & 1) $('[data-kb="Shift"]').classList.add('kb-on');
    if (k?.m & 2) $('[data-kb="AltGr"]')?.classList.add('kb-on');
    kbTimer = setTimeout(() => { off(); kbTimer = setTimeout(() => step(i + 1), 120) }, 520);
  };
  step(0);
}
const kbHold = e => {
  const h = (e.shiftKey ? 1 : 0) + (e.getModifierState?.('AltGraph') || (e.altKey && kbLayers > 2) ? 2 : 0);
  if (h !== kbHeld) { kbHeld = h; kbFaces() }
};
$('#kbIn').addEventListener('keyup', kbHold);
$('#kbIn').addEventListener('blur', () => { kbHeld = 0; kbFaces() });
$('#kbIn').addEventListener('keydown', e => {
  kbHold(e);
  const alt = e.getModifierState?.('AltGraph') || (e.altKey && kbLayers > 2);
  if ((e.ctrlKey && !alt) || e.metaKey || (e.altKey && !alt) || e.isComposing) return;
  const k = KB.find(k => k.code === e.code); if (!k) return;
  e.preventDefault(); kbType(k.out[(alt ? 2 : 0) + (e.shiftKey ? 1 : 0)]); kbFlash(k.code);
});
$('#kbIn').addEventListener('input', e => { const el = e.target, v = kbS().conv(el.value); if (v !== el.value) el.value = v; kbUpdate() });
$('#kbRows').addEventListener('click', e => {
  const code = e.target.closest('[data-kb]')?.dataset.kb; if (!code) return;
  const el = $('#kbIn');
  if (code === 'Shift' || code === 'AltGr') { kbMod ^= code === 'Shift' ? 1 : 2; return kbUpdate() }
  if (code === 'Backspace') {
    const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    const cut = a === b ? (a && /[\uDC00-\uDFFF]/.test(el.value[a - 1]) ? 2 : 1) : 0;
    el.setRangeText('', Math.max(0, a - cut), b, 'end'); kbFlash(code); return kbUpdate();
  }
  const k = KB.find(k => k.code === code);
  kbType(code === 'Space' ? ' ' : k.out[kbMod]); kbFlash(code);
  if (kbMod) { kbMod = 0; kbUpdate() }
});
$('#kbEx').addEventListener('click', e => {
  const w = e.target.closest('[data-kbex]')?.dataset.kbex; if (!w) return;
  $('#kbIn').value = w; kbUpdate(); kbPlay();
});
$('#kbTabs').addEventListener('click', e => {
  const i = e.target.closest('[data-kbset]')?.dataset.kbset; if (i == null) return;
  kbSet = +i; kbMod = 0; clearTimeout(kbTimer); $('#kbIn').value = ''; kbRender(); icons();
});
$('#kbPlay').onclick = kbPlay;
$('#kbClear').onclick = () => { clearTimeout(kbTimer); $('#kbIn').value = ''; kbUpdate() };

function renderAll() {
  renderText(); renderSounds(); renderTones(); renderPoster(); renderAlphabet(); renderPhrases();
  renderNum(); renderBody(); renderVerbs(); renderQues(); renderCls(); renderFood(); renderSent(); renderTopVerbs(); renderHero(); renderPools();
  renderAns(); renderDlg(); renderEtq(); renderSigns(); lRender(); spRender(); renderMore(); kbRender(); renderTwisters(); renderLearn(); navFill();
  fcShow(); qRender(); tRender(); trRender(); icons();
}
$$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('tf-lang', lang); renderAll() });
$$('[data-gender]').forEach(b => b.onclick = () => { gender = b.dataset.gender; store.set('tf-gender', gender); renderAll() });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
$$('.reveal').forEach(el => io.observe(el));

deck = shuffle(items().map((_, i) => i));
qNext();
tNext(false);
lNext(false);
spk.i = Math.random() * PH.length | 0;
dlgStart(0, false);
renderTabs();
renderVtabs();
renderAll();
const audioIO = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  audioIO.unobserve(e.target);
  (window.requestIdleCallback || setTimeout)(() => e.target.querySelectorAll('[data-say]:not([data-say=""])').forEach(b => preloadIdle(b.dataset.say, b.dataset.voice)));
}), { rootMargin: '300px' });
$$('main > section').forEach(sec => audioIO.observe(sec));
// first screen right away: the phrase of the day now, the rest of its list in the background
preload(say(HERO[heroI]));
HERO.forEach(x => preloadIdle(say(x)));

/* ================= OFFLINE ================= */
// sw.js keeps the whole site (page, audio, libraries, fonts) for use without internet and, when online,
// downloads only what changed (offline.json, written by tools/offline.py on every commit)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const OFF = {
    ru: ['Сохраняем сайт для работы без интернета: {p}%', 'Сайт сохранён — работает и без интернета', 'Нет сети — открыта сохранённая версия'],
    en: ['Saving the site for offline use: {p}%', 'Saved — the site works without internet too', 'Offline — showing the saved version'],
    th: ['กำลังบันทึกเว็บไว้ใช้แบบออฟไลน์: {p}%', 'บันทึกแล้ว ใช้งานได้แม้ไม่มีอินเทอร์เน็ต', 'ไม่มีอินเทอร์เน็ต กำลังแสดงเวอร์ชันที่บันทึกไว้'],
  };
  const offSay = (i, p) => { const el = document.getElementById('offlineState'); if (el) el.textContent = (OFF[document.documentElement.lang] || OFF.en)[i].replace('{p}', p) };
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'offline') return;
    if (d.offline) offSay(2); else if (d.done < d.total) offSay(0, Math.floor(d.done / d.total * 100)); else offSay(1);
  });
  addEventListener('offline', () => offSay(2));
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
      .then(r => r.active && r.active.postMessage({ type: 'sync', full: !(navigator.connection && navigator.connection.saveData) }))
      .catch(() => {});
  });
}
